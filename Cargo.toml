[package]
name = "ollama-gui"
version = "0.1.0"
edition = "2021"
description = "A native GTK4/libadwaita desktop client for Ollama"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_24"] }
libadwaita = { version = "0.9", features = ["v1_10"] }
sourceview5 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
pulldown-cmark = "0.13"
